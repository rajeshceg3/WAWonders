<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Western Australia: A Natural Canvas</title>
    
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>

    <div id="map"></div>
    <div id="particles-overlay"></div>

    <div class="top-controls">
        <button id="browse-toggle" class="control-btn">Places</button>
        <button id="reset-map" class="control-btn">Reset</button>
        <button id="tour-toggle" class="control-btn">Start tour</button>
        <button id="theme-toggle" class="control-btn" aria-label="Toggle Theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-dark"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-light" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <button id="audio-toggle" class="control-btn" aria-label="Toggle Audio">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="audio-icon-muted"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="audio-icon-unmuted" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
    </div>

    <div id="info-drawer">
        <div class="drawer-handle"></div>
        <!-- MITIGATION FOR BUG-005: Use a semantic <button> for accessibility. -->
        <button class="close-button" id="close-drawer" aria-label="Close details panel"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/></svg></button>
        <div class="drawer-header">
            <input type="text" id="location-search" placeholder="Search wonders..." aria-label="Search locations" class="search-input">
            <h1>Western Australia</h1><p class="guide-caption">21 landscapes and heritage places</p>
        </div>
        <div id="views-container">
            <div id="location-list-container">
                <ul id="location-list"></ul>
            </div>
            <div id="detail-view"></div>
        </div>
    </div>

    <div id="coordinate-tracker"></div><p id="map-status" role="status" hidden>Some map tiles could not load. Place details and search still work.</p>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
